# 0. PATH 설정 (run-shell 에서 Homebrew 바이너리 접근용)
set-environment -g PATH "/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# 1. 기본 설정
unbind C-s
set-option -g prefix C-a
bind C-a send-prefix             # C-a 두 번 = 셸에 C-a 전달 (줄 맨 앞 이동)
set -g base-index 1
set -g renumber-windows on       # 창 닫으면 번호 당기기
set -g mouse on
set -g mode-keys vi

# 기본 쉘 zsh로 고정
set-option -g default-shell /bin/zsh

# 2. 색상 및 터미널 설정 (True Color)
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
# 앱이 그린 OSC 8 하이퍼링크를 바깥 터미널로 넘긴다. 없으면 tmux 가 링크를 지우고 글자만 보낸다
set -as terminal-features ",xterm-ghostty:hyperlinks,xterm-256color:hyperlinks"

# 앱이 보낸 터미널 고유 이스케이프 시퀀스를 iTerm2 로 통과시킴
# (Claude Code 네이티브 알림 배너 · OSC 52 클립보드용)
set -g allow-passthrough on

# 비활성 패널 어둡게
set -g window-style 'bg=colour235'
set -g window-active-style 'bg=black'

# 3. 윈도우/패널 제목 설정
set-window-option -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set-option -g set-titles on

# 3-1. pane border 상단에 title(예: claude /rename 값) + 디렉토리 이름 + git 브랜치 표시
set -g pane-border-status top
set -g pane-border-format ' #[fg=#{@thm_peach},bold] #{pane_title}#[nobold] #[fg=#{@thm_overlay_0}](#{b:pane_current_path}#(cd "#{pane_current_path}" 2>/dev/null && git rev-parse --abbrev-ref HEAD >/dev/null 2>&1 && echo ":")#(cd "#{pane_current_path}" 2>/dev/null && git rev-parse --abbrev-ref HEAD 2>/dev/null))#[default] '

# 4. 성능 및 히스토리
set -sg escape-time 0
set -g history-limit 10000
set -g status-interval 1

# 5. 키 바인딩 (화면 분할 및 이동)
# 현재 경로에서 창 열기
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# prefix + | 로 오른쪽 40% pane 생성
bind | split-window -h -l 40% -c "#{pane_current_path}"

# 패널 크기 조절 (Vim 스타일)
bind-key J resize-pane -D 10
bind-key K resize-pane -U 10
bind-key H resize-pane -L 10
bind-key L resize-pane -R 10

# Shift 화살표로 윈도우 이동
bind -n S-Left  previous-window
bind -n S-Right next-window

# 확장 키(Shift, Alt 등) 입력 허용
# set -s extended-keys on
# set -as terminal-features 'xterm*:extkeys'

# 설정 리로드
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# 6. Smart Pane Switching (Vim-Tmux Navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -n C-h run "($is_vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "($is_vim && tmux send-keys C-j) || ($is_fzf && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "($is_vim && tmux send-keys C-k) || ($is_fzf && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "($is_vim && tmux send-keys C-l) || tmux select-pane -R"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# 7. 마우스 및 복사 설정
set -g @yank_with_mouse 'off'                        # 드래그 자동 yank 끄기 (선택만 유지)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 8. 플러그인 목록
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.1.2'
# set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'IngoMeyer441/tmux-easy-motion'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # 목록 맨 끝에 둔다 (status-right 에 자동 저장을 끼워 넣음)

# 세션 저장/복원 (재부팅해도 창 배치 + Claude 대화 유지)
set -g @continuum-restore 'on'                 # tmux 서버가 켜질 때 마지막 저장본 자동 복원
set -g @continuum-save-interval '5'            # 5분마다 자동 저장 (수동: prefix + C-s)
set -g @resurrect-hook-post-save-layout '~/vim_settings/tmux-claude-save.sh'
set -g @resurrect-hook-post-restore-all '~/vim_settings/tmux-claude-restore.sh'

# floax 설정
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

# 9. Catppuccin 테마 (옵션 + 플러그인 실행 + 상태바 포맷)
source-file ~/vim_settings/catppuccin.tmux.conf

# 12. 한글 입력 모드 지원 (Korean IME keybinding fallback)
set -g prefix2 C-ㅁ                                              # C-a → C-ㅁ
bind ㅊ new-window -c "#{pane_current_path}"                      # c → ㅊ
bind ㅈ choose-tree -wZ -F '#{window_index}: #{window_name} #{?window_active,(active),}'  # w → ㅈ
bind ㄱ source-file ~/.tmux.conf \; display "Config reloaded!"      # r → ㄱ
bind ㅁ display-popup -E -w 100% -h 100% -d "#{pane_current_path}" "workmux dashboard"  # a → ㅁ

bind-key ㅓ resize-pane -D 10                                     # J → ㅓ
bind-key ㅏ resize-pane -U 10                                     # K → ㅏ
bind-key ㅗ resize-pane -L 10                                     # H → ㅗ
bind-key ㅣ resize-pane -R 10                                     # L → ㅣ

# 14. Workmux (Dashboard + Sidebar)
bind a display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "workmux dashboard"
bind X run-shell "workmux set-window-status clear"
bind Q switch-client -T kill-confirm
bind-key -T kill-confirm Q kill-window
# prefix Q W : workmux 로 worktree + window + branch 강제 삭제 (uncommitted 무시) — y/n 확인 후 실행
bind-key -T kill-confirm W confirm-before -p "워크트리 강제 삭제 (uncommitted 포함)? #{pane_current_path} (y/n)" "run-shell \"cd '#{pane_current_path}' && workmux remove -f\""
bind m command-prompt -p "move window to:" "swap-window -t '%%'"

# 15. IDE 열기 (현재 디렉토리 기준)
bind J run-shell '"/Users/sam/Library/Application Support/JetBrains/Toolbox/scripts/idea" "#{pane_current_path}"'

# 15-1. 현재 디렉토리 셸 팝업
bind T display-popup -E -w 70% -h 70% -d "#{pane_current_path}" "$SHELL -l"

# 15-2. lazygit 팝업
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# 15-3. 현재 디렉토리 nvim 팝업 (같은 키로 토글: 열기/내리기)
bind e if-shell -F '#{==:#{session_name},scratch-nvim}' \
  'detach-client' \
  "display-popup -E -w 90% -h 90% -d '#{pane_current_path}' 'tmux new-session -A -s scratch-nvim -c \"#{pane_current_path}\" nvim .'"

# 16. config-properties 서비스 선택 팝업
bind P display-popup -E -w 80% -h 80% \
  "dir=\$(ls -d /Users/sam/workspace/spoon/config-properties/*/ | xargs -n1 basename | fzf --prompt='service> ') && cd /Users/sam/workspace/spoon/config-properties/\$dir && nvim ."

# 17. Claude Code fzf launcher (ccf 팝업 버전)
bind C display-popup -E -w 60% -h 60% "~/vim_settings/ccf-popup.sh"

# 13. TPM 실행 (반드시 맨 끝)
run '~/.tmux/plugins/tpm/tpm'

# 18. 플러그인 로드 후 오버라이드 (tpm 이후여야 copycat 이 덮어쓰지 못함)
# tmux 기본값이 copy-pipe-and-cancel 이라 @yank_with_mouse off 만으로는 드래그 자동 복사가 남는다.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
